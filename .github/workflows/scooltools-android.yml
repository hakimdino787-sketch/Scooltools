name: MyScool web check and production Android APK

on:
  push:
    branches:
      - main
      - fix/scooltools-android-admob
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-check:
    name: Check website JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.cjs

  android-apk:
    name: Build MyScool APK with configured AdMob IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build MyScool APK
        working-directory: android
        run: |
          gradle --no-daemon clean :app:assembleDebug -PADMOB_APP_ID='ca-app-pub-2536808054649336~2487863199' -PADMOB_BANNER_ID='ca-app-pub-2536808054649336/1278723301'
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MyScool-AdMob.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myscool-android-apk
          path: android/app/build/outputs/apk/debug/MyScool-AdMob.apk
          if-no-files-found: error
          retention-days: 30
