name: MyScool web check and Android APK

on:
  push:
    branches:
      - main
      - fix/scooltools-android-admob
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-check:
    name: Check website JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate inline JavaScript
        run: node scripts/check-inline-js.cjs

  android-apk:
    name: Build Android APKs (test and MyScool AdMob)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build safe test APK (Google test ad IDs)
        working-directory: android
        run: |
          gradle --no-daemon :app:assembleDebug -PADMOB_APP_ID='ca-app-pub-3940256099942544~3347511713' -PADMOB_BANNER_ID='ca-app-pub-3940256099942544/6300978111'
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/myscool-test-ads.apk
      - name: Build APK configured with MyScool AdMob IDs
        working-directory: android
        run: |
          gradle --no-daemon clean :app:assembleDebug -PADMOB_APP_ID='ca-app-pub-2536808054649336~3749576618' -PADMOB_BANNER_ID='ca-app-pub-2536808054649336/1123413272'
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/myscool-admob-configured.apk
          cp /tmp/myscool-test-ads.apk app/build/outputs/apk/debug/myscool-test-ads.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myscool-android-apks
          path: |
            android/app/build/outputs/apk/debug/myscool-test-ads.apk
            android/app/build/outputs/apk/debug/myscool-admob-configured.apk
          if-no-files-found: error
          retention-days: 14
