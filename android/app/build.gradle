plugins { id "com.android.application" }

def admobAppId = project.findProperty("ADMOB_APP_ID") ?: "ca-app-pub-2536808054649336~3749576618"
def admobBannerId = project.findProperty("ADMOB_BANNER_ID") ?: "ca-app-pub-2536808054649336/1123413272"

android {
    namespace "com.scooltools.app"
    compileSdk 35
    defaultConfig {
        applicationId "com.scooltools.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField "String", "ADMOB_BANNER_ID", '"' + admobBannerId + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-ads:24.7.0"
    implementation "com.google.android.ump:user-messaging-platform:3.2.0"
}
